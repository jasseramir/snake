<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>

    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <main class="game">
        <h1 class="game-title">Snake Game</h1>

        <canvas class="game-canvas" id="gameCanvas"></canvas>

        <section class="controls">
            <button class="arrow up" id="up">
                <span></span>
            </button>

            <div class="middle-controls">
                <button class="arrow left" id="left">
                    <span></span>
                </button>

                <div class="status" id="status">
                    <h2>Score</h2>
                    <p id="score"></p>
                </div>

                <button class="arrow right" id="right">
                    <span></span>
                </button>
            </div>

            <button class="arrow down" id="down">
                <span></span>
            </button>
        </section>
    </main>

    <script src="assets/scripts/script.js"></script>
</body>
</html>
